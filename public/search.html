<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cari - Wibu.ID</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="styles.css"></head>
<body class="bg-[#080808] text-white">
<aside class="hidden md:flex fixed left-0 top-0 bottom-0 w-[68px] bg-black border-r border-white/[0.06] flex-col items-center py-5 z-50">
  <a href="index.html" class="w-8 h-8 rounded bg-[#E50914] flex items-center justify-center font-black text-sm">W</a>
  <nav class="mt-8 flex flex-col items-center gap-6 w-full">
    <a href="search.html" class="nav-active w-full flex justify-center py-1"><i data-lucide="search" class="w-5 h-5"></i></a>
    <a href="index.html" class="w-full flex justify-center py-1 text-zinc-500 hover:text-white"><i data-lucide="house" class="w-5 h-5"></i></a>
    <a href="index.html#new" class="w-full flex justify-center py-1 text-zinc-500 hover:text-white"><i data-lucide="clapperboard" class="w-5 h-5"></i></a>
  </nav>
</aside>
<main class="md:ml-[68px] max-w-[1400px] mx-auto px-4 md:px-8 py-6">
  <a href="index.html" class="inline-flex items-center gap-2 text-sm text-zinc-400 hover:text-white"><i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali</a>
  <h1 class="mt-4 text-2xl font-black">Cari Anime & Video</h1>
  <p class="text-sm text-zinc-500 mt-1">Data live dari Bstation — semua tombol aktif, thumbnail anti-error</p>
  <form onsubmit="event.preventDefault(); doSearch(document.getElementById('q').value)" class="mt-4 flex gap-2">
    <input id="q" placeholder="Ketik: naruto, one piece, frieren, solo leveling..." class="flex-1 h-11 px-4 rounded-full bg-[#141414] border border-white/10 text-sm focus:outline-none focus:border-white/20">
    <button class="px-6 h-11 rounded-full bg-[#E50914] text-white text-sm font-bold">Cari</button>
  </form>
  <div id="resultInfo" class="mt-4 text-xs text-zinc-500"></div>
  <div id="resultGrid" class="mt-3 flex gap-3 overflow-x-auto no-scrollbar pb-4 flex-wrap"></div>
  <div id="resultGrid2" class="mt-2 flex gap-3 overflow-x-auto no-scrollbar pb-6 flex-wrap"></div>
</main>
<script src="client-data.js"></script>
<script>
function safeCover(u){ if(!u) return 'https://via.placeholder.com/300x400/141414/ffffff?text=No+Cover'; if(u.startsWith('//')) return 'https:'+u; return u; }
function cardHTML(a){ const cover=safeCover(a.cover); return `<a href="player.html?id=${a.id}&type=${a.type||'ugc'}" class="card-hover flex-shrink-0 w-[145px] md:w-[168px] rounded-[6px] overflow-hidden bg-[#141414] block border border-white/5"><div class="aspect-[2/3] relative overflow-hidden bg-zinc-900"><img src="${cover}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x400/141414/ffffff?text=No+Cover'" class="w-full h-full object-cover"><span class="absolute top-1.5 left-1.5 bg-black/70 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">${a.badge||'N'}</span>${a.duration?`<span class="absolute bottom-1 right-1 bg-black/80 text-white text-[10px] px-1 py-0.5 rounded">${a.duration}</span>`:''}</div><div class="px-2 py-2"><div class="text-[11px] font-semibold line-clamp-2 min-h-[30px]">${a.title||'No Title'}</div><div class="text-[10px] text-zinc-500 mt-1 truncate">${a.views||''}</div></div></a>`; }
async function doSearch(q){
  if(!q) return;
  document.getElementById('resultInfo').textContent='Mencari "'+q+'" di Bstation...';
  try{
    const res=await fetch('/api/bstation?cmd=search&q='+encodeURIComponent(q)+'&lang=id').then(r=>r.json());
    if(res.error) throw new Error(res.error);
    document.getElementById('resultInfo').textContent=`Ditemukan ${res.totals.anime} anime • ${res.totals.videos} video untuk "${q}"`;
    document.getElementById('resultGrid').innerHTML=(res.anime||[]).map(cardHTML).join('') || '<div class="text-xs text-zinc-500">Tidak ada anime</div>';
    document.getElementById('resultGrid2').innerHTML=(res.videos||[]).map(cardHTML).join('') || '<div class="text-xs text-zinc-500">Tidak ada video</div>';
    lucide.createIcons();
  }catch(e){ document.getElementById('resultInfo').innerHTML='<span class="text-red-400">Error: '+e.message+'</span>'; }
}
const params=new URLSearchParams(location.search); if(params.get('q')){ document.getElementById('q').value=params.get('q'); doSearch(params.get('q')); }
lucide.createIcons();
</script>
</body></html>
